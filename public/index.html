<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1220" />
    <meta
      name="description"
      content="REVA University campus Wi-Fi signal mapping and management."
    />
    <title>Campus Wi-Fi | REVA University</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/dashboard.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <a class="brand" href="#dashboard" aria-label="REVA Campus Wi-Fi home">
          <span class="brand-mark" aria-hidden="true">R</span>
          <span class="brand-copy">
            <strong>REVA</strong>
            <small>Campus Wi-Fi</small>
          </span>
        </a>

        <p class="nav-caption">WORKSPACE</p>
        <nav class="main-nav" aria-label="Main navigation">
          <button data-view="dashboard" class="active">
            <span class="nav-icon" aria-hidden="true">◫</span>Dashboard
          </button>
          <button data-view="locations">
            <span class="nav-icon" aria-hidden="true">⌖</span>Locations
          </button>
          <button data-view="accessPoints">
            <span class="nav-icon" aria-hidden="true">⌁</span>Access points
          </button>
          <button data-view="users">
            <span class="nav-icon" aria-hidden="true">♙</span>Users
          </button>
          <button data-view="readings">
            <span class="nav-icon" aria-hidden="true">⌁</span>Wi-Fi readings
          </button>
          <button data-view="reports">
            <span class="nav-icon" aria-hidden="true">▤</span>Reports &amp; analytics
          </button>
        </nav>

        <div class="sidebar-footer">
          <span class="sidebar-footer-dot" aria-hidden="true"></span>
          <span>Campus network workspace</span>
        </div>
      </aside>

      <div class="app-content">
        <header class="topbar">
          <button
            type="button"
            class="menu-toggle"
            id="menu-toggle"
            aria-label="Toggle navigation"
            aria-expanded="false"
            aria-controls="sidebar"
          >
            <span></span><span></span><span></span>
          </button>
          <div class="topbar-heading">
            <span class="eyebrow">REVA UNIVERSITY</span>
            <h1 id="page-title">Dashboard</h1>
          </div>
          <div class="topbar-status">
            <span class="status-indicator" aria-hidden="true"></span>
            <span id="connection-status" role="status">Connecting to services…</span>
          </div>
        </header>

        <main id="main-content">
          <section id="view-dashboard" class="view active" aria-label="Dashboard"></section>
          <section id="view-locations" class="view" aria-label="Locations"></section>
          <section id="view-accessPoints" class="view" aria-label="Access points"></section>
          <section id="view-users" class="view" aria-label="Users"></section>
          <section id="view-readings" class="view" aria-label="Wi-Fi readings"></section>
          <section id="view-reports" class="view" aria-label="Reports and analytics"></section>
        </main>
      </div>
    </div>

    <dialog id="form-dialog">
      <form novalidate>
        <div class="dialog-heading">
          <div>
            <span class="eyebrow">CAMPUS WIFI MANAGEMENT</span>
            <h2></h2>
          </div>
          <button type="button" class="dialog-close" data-cancel aria-label="Close dialog">×</button>
        </div>
        <div class="form-fields"></div>
        <p class="form-error" role="alert"></p>
        <div class="form-actions">
          <button type="button" class="btn" data-cancel>Cancel</button>
          <button type="submit" class="btn primary">Save changes</button>
        </div>
      </form>
    </dialog>

    <div id="toast-container" aria-live="polite" aria-atomic="true"></div>

    <script src="/js/api.js" defer></script>
    <script src="/js/dashboard.js" defer></script>
    <script src="/js/locations.js" defer></script>
    <script src="/js/accessPoints.js" defer></script>
    <script src="/js/users.js" defer></script>
    <script src="/js/readings.js" defer></script>
    <script src="/js/reports.js" defer></script>
    <script src="/js/script.js" defer></script>
  </body>
</html>
